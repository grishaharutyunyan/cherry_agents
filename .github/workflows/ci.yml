name: CI — Build & Deploy Staging

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/grishaharutyunyan/cherry_agents

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            export AGENTS_TAG=${{ github.sha }}
            COMPOSE_PROJECT_NAME=cherry-staging \
              docker compose -f docker-compose.yml -f docker-compose.staging.yml \
              --env-file .env.staging \
              pull cherry_agents
            # Remove leftovers of an interrupted recreate. Compose renames the old
            # container to <12-hex-id>_<name> before replacing it; a stale one makes the
            # next rename fail with "container name ... is already in use".
            docker ps -a \
              --filter "label=com.docker.compose.project=cherry-staging" \
              --filter "label=com.docker.compose.service=cherry_agents" \
              --format '{{.ID}} {{.Names}}' \
              | grep -E ' [0-9a-f]{12}_' | cut -d' ' -f1 | xargs -r docker rm -f || true
            COMPOSE_PROJECT_NAME=cherry-staging \
              AGENTS_TAG=${{ github.sha }} \
              docker compose -f docker-compose.yml -f docker-compose.staging.yml \
              --env-file .env.staging \
              up -d --no-deps cherry_agents
