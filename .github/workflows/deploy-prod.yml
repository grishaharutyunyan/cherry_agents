name: Deploy — Production

on:
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/grishaharutyunyan/cherry_agents

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: production  # GitHub Environment with required reviewer

    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote image to prod tag
        run: |
          docker buildx imagetools create \
            ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --tag ${{ env.IMAGE_NAME }}:${{ github.ref_name }} \
            --tag ${{ env.IMAGE_NAME }}:prod

      - name: Deploy to production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            export AGENTS_TAG=${{ github.ref_name }}
            COMPOSE_PROJECT_NAME=cherry-prod \
              docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              --env-file .env.prod \
              pull cherry_agents
            COMPOSE_PROJECT_NAME=cherry-prod \
              AGENTS_TAG=${{ github.ref_name }} \
              docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              --env-file .env.prod \
              up -d --no-deps cherry_agents
